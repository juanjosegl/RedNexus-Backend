# Despliegue del backend en Dokploy (servidor compartido del diplomado).
# Dokploy clona este repo, construye la imagen en el servidor y levanta el stack con:
#   docker compose -f docker-compose.dokploy.yml up -d --build
#
# Variables (pestaña Environment de Dokploy; Dokploy las escribe en un .env junto a este archivo):
#   POSTGRES_PASSWORD  obligatoria. Solo letras y números (va dentro de DATABASE_URL): openssl rand -hex 24
#   JWT_SECRET         obligatoria: openssl rand -hex 32
#   AI_PROVIDER        mock (por defecto) u ollama
#   OLLAMA_URL         solo si AI_PROVIDER=ollama
#   TRANSCRIBE_PROVIDER mock (por defecto) o whisper; WHISPER_URL solo si es whisper
#   SEED_DEMO          true (por defecto) carga los perfiles sintéticos en cada despliegue (upsert)
#   SUPPORT_PROVIDER   mock (por defecto) u openwebui (asistente de soporte con RAG)
#   OPENWEBUI_URL, OPENWEBUI_API_KEY, SUPPORT_MODEL, SUPPORT_TIMEOUT_MS  solo si es openwebui.
#   OTEL_EXPORTER_OTLP_ENDPOINT, OTEL_EXPORTER_OTLP_HEADERS  opcionales: trazas y métricas a Grafana Cloud.
#   FRONTEND_TAG       etiqueta de ghcr.io/juanjosegl/rednexus-frontend (por defecto main)
#                      La API key va solo en la pestaña Environment, nunca en el repo.
#
# Reglas por ser un servidor compartido con otros grupos:
#   - Sin "ports": nada se publica en el host (el 3000 es de Dokploy). La app sale por Traefik con el
#     dominio que se asigna en la pestaña Domains de Dokploy: servicio rednexus-web, puerto 8080
#     (el frontend reenvía /api a la API, como en Kubernetes). Opcional: otro dominio para
#     rednexus-api, puerto 3000, si se quiere Swagger aparte.
#   - Sin container_name, y nombres de servicio con prefijo para no chocar en la red de Dokploy.
#   - Límite de memoria en cada servicio.
#
# Prueba local: POSTGRES_PASSWORD=local JWT_SECRET=local docker compose -f docker-compose.dokploy.yml up -d --build

x-api-env: &api-env
  NODE_ENV: production
  PORT: '3000'
  DATABASE_URL: postgresql://rednexus:${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}@rednexus-postgres:5432/rednexus
  REDIS_HOST: rednexus-redis
  REDIS_PORT: '6379'
  JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET}
  AI_PROVIDER: ${AI_PROVIDER:-mock}
  OLLAMA_URL: ${OLLAMA_URL:-http://localhost:11434}
  OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-qwen2.5:3b}
  OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-paraphrase-multilingual}
  OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-20000}
  TRANSCRIBE_PROVIDER: ${TRANSCRIBE_PROVIDER:-mock}
  WHISPER_URL: ${WHISPER_URL:-http://localhost:8178}
  SUPPORT_PROVIDER: ${SUPPORT_PROVIDER:-mock}
  OPENWEBUI_URL: ${OPENWEBUI_URL:-http://localhost:3001}
  OPENWEBUI_API_KEY: ${OPENWEBUI_API_KEY:-}
  SUPPORT_MODEL: ${SUPPORT_MODEL:-asistente-rednexus}
  SUPPORT_TIMEOUT_MS: ${SUPPORT_TIMEOUT_MS:-60000}
  # PL-07: vacío = telemetría apagada (Grafana Cloud: endpoint OTLP y cabecera de autorización)
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}

services:
  rednexus-postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: rednexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}
      POSTGRES_DB: rednexus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rednexus']
      interval: 5s
      retries: 10
    mem_limit: 512m

  rednexus-redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10
    mem_limit: 128m

  # Migraciones (y datos sintéticos) antes de la API y el worker. Los tres servicios usan la misma
  # imagen; cada uno declara "build" para que Compose nunca intente descargarla (la caché la construye una vez).
  rednexus-migrate:
    image: rednexus-api:dokploy
    build: .
    command:
      - sh
      - -c
      - prisma migrate deploy && if [ "$${SEED_DEMO:-true}" = "true" ]; then prisma db seed; fi
    environment:
      DATABASE_URL: postgresql://rednexus:${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}@rednexus-postgres:5432/rednexus
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      rednexus-postgres:
        condition: service_healthy
    mem_limit: 384m

  rednexus-api:
    image: rednexus-api:dokploy
    build: .
    restart: unless-stopped
    environment: *api-env
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    depends_on:
      rednexus-migrate:
        condition: service_completed_successfully
      rednexus-redis:
        condition: service_healthy
    mem_limit: 384m

  rednexus-worker:
    image: rednexus-api:dokploy
    build: .
    restart: unless-stopped
    command: ['node', 'dist/worker']
    environment: *api-env
    depends_on:
      rednexus-migrate:
        condition: service_completed_successfully
      rednexus-redis:
        condition: service_healthy
    mem_limit: 384m

  # Frontend: la imagen firmada de GHCR (workflow "Imagen" de RedNexus-Frontend). Nginx sirve la
  # app y reenvía /api a rednexus-api, así que en Dokploy basta UN dominio, el de este servicio.
  # pull_policy always: cada redespliegue trae la última imagen de main.
  rednexus-web:
    image: ghcr.io/juanjosegl/rednexus-frontend:${FRONTEND_TAG:-main}
    pull_policy: always
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://rednexus-api:3000
    depends_on:
      rednexus-api:
        condition: service_healthy
    mem_limit: 64m

volumes:
  pgdata:
